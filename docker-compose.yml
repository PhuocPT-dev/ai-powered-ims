version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: ims-mysql
    restart: always
    env_file:
      - .env.docker
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: ims-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql-db
    depends_on:
      - mysql-db
    env_file:
      - ./backend/.env.production
      
  frontend:
    build: ./frontend
    container_name: ims-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
